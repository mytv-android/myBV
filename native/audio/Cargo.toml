[package]
name = "mybv-audio"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Allocation-free PCM processing kernels for the myBV player"

[lib]
name = "mybv_audio"
crate-type = ["cdylib", "rlib"]

[features]
default = []
jni-bridge = ["dep:jni"]

[dependencies]
jni = { version = "0.21.1", optional = true, default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
