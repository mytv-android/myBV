[package]
name = "mybv-encode"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Optional Android E-AC-3 encoder JNI with LGPL FFmpeg ABI glue"

[lib]
name = "mybv_encode"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = { version = "0.21.1", default-features = false }

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
